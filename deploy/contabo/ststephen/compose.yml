# St Stephen's Brothers' School, Kimaeti — EMS on the shared Contabo box.
#
# Source: github.com/simboni/st-stephen-kimaeti  (cloned to ./repo)
#
# This REPLACES an earlier deployment built from simboni/hollycrossbulimbo,
# which was months behind: different logo, different theme, and missing the
# boarding and transport modules entirely. Its project was `stephens`; this
# one is `ststephen`, so the two can run side by side while the new one is
# checked, and the old one removed only once this is serving.
#
# Safety, unchanged from every other app here:
#   · own compose project, containers, volume and private network
#   · no published host port — edge-caddy owns 80/443
#   · `edge` joined as external, never modified
#   · mem_limit on both services; this box has no swap
#
#   cd /srv/ststephen && docker compose up -d --build
name: ststephen

services:
  db:
    image: postgres:16-alpine
    container_name: ststephen-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ststephen
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ststephen
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      # Not on `edge`: only our own EMS can reach the school's database.
      - internal
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ststephen -d ststephen"]
      interval: 10s
      timeout: 5s
      retries: 12

  ems:
    build:
      context: ./repo/apps/ems
      args:
        # Stable across rebuilds, or a form submitted mid-deploy fails with
        # "Failed to find Server Action".
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:?set it in .env}
    image: ststephen-ems:local
    container_name: ststephen-ems
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ststephen:${DB_PASSWORD}@db:5432/ststephen
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      # Read only while the User table is empty. Blank it once changed in-app.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # This database holds real children. Never the demo pupils.
      SEED_DEMO: "false"
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal
      - edge
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  # `docker compose down` keeps this. Only `down -v` destroys the school's
  # records.
  db-data:

networks:
  internal:
  edge:
    external: true
