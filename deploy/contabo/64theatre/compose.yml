# 64theatre on the Contabo box — demo / client-review deployment.
#
# This is the STAGING shape from the repo's render.yaml: one container
# (nginx + PHP-FPM), SQLite on a volume, demo content seeded on boot, and the
# fake payment gateway so checkouts complete without Daraja keys. That is what
# you want before the domain and M-Pesa credentials exist.
#
# For go-live, see "Upgrading to production" in the README — Postgres, Redis,
# a queue worker and PAYMENT_GATEWAY=daraja.
#
# Ports: none published. edge-caddy owns 80/443 and proxies to 64theatre:8080.
#
#   cd /srv/64theatre && docker compose up -d --build

name: 64theatre

services:
  app:
    build:
      context: ./repo
    image: 64theatre:local
    container_name: 64theatre
    restart: unless-stopped
    environment:
      APP_NAME: 64theatre
      # `staging` re-seeds the demo season on every boot. Switch to
      # `production` in .env when the client's real shows go in — the admin
      # user and organiser are still seeded, only demo content stops.
      APP_ENV: ${APP_ENV:-staging}
      APP_DEBUG: "false"
      # Must stay stable — it encrypts sessions and cookies. If it changes,
      # everyone is logged out.
      APP_KEY: ${APP_KEY:?set in .env}
      # Must match the public URL exactly: ticket QR codes and emailed links
      # are built from it.
      APP_URL: ${APP_URL:?set in .env}

      DB_CONNECTION: sqlite
      # Inside the mounted volume, so the database survives rebuilds.
      DB_DATABASE: /var/www/html/storage/app/database.sqlite

      # Seeds the demo production + admin user. Idempotent; set false for real data.
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      # `fake` completes checkouts instantly for demos. `kopokopo` sells through
      # an aggregator today; `daraja` once Safaricom approves 64 Theatre's own
      # paybill. See "Taking money" in the README.
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}

      # Kopo Kopo. Absent, the gateway reads null credentials and every
      # checkout fails at the OAuth call — so these must be passed through
      # even though they are blank until the client's account is live.
      KOPOKOPO_BASE_URL: ${KOPOKOPO_BASE_URL:-https://sandbox.kopokopo.com}
      KOPOKOPO_CLIENT_ID: ${KOPOKOPO_CLIENT_ID:-}
      KOPOKOPO_CLIENT_SECRET: ${KOPOKOPO_CLIENT_SECRET:-}
      # Signs incoming webhooks. NOT the client secret.
      KOPOKOPO_API_KEY: ${KOPOKOPO_API_KEY:-}
      KOPOKOPO_TILL_NUMBER: ${KOPOKOPO_TILL_NUMBER:-}

      # Pay Bill details shown to a buyer whose STK prompt never arrived.
      OFFLINE_PAYMENT_ENABLED: ${OFFLINE_PAYMENT_ENABLED:-true}
      OFFLINE_PAYMENT_PAYBILL: ${OFFLINE_PAYMENT_PAYBILL:-542542}
      OFFLINE_PAYMENT_ACCOUNT: ${OFFLINE_PAYMENT_ACCOUNT:-064064}
      OFFLINE_PAYMENT_BANK: ${OFFLINE_PAYMENT_BANK:-I&M Bank}

      # Printed on tickets and in emails. Set it to the public site, which is
      # not necessarily this app's own host.
      BRAND_WEBSITE: ${BRAND_WEBSITE:-}
      BRAND_INSTAGRAM: ${BRAND_INSTAGRAM:-@64theatre}

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync      # jobs run inline — no worker container needed

      # Email. `log` writes ticket emails to the container log and delivers
      # them to NOBODY — fine for a demo, silent failure once real tickets are
      # sold. Set MAIL_MAILER=smtp in .env with the Brevo values below.
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      # Laravel 13 reads MAIL_SCHEME, not MAIL_ENCRYPTION. `smtp` on 587 uses
      # STARTTLS; port 465 would need `smtps`.
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Must be a sender Brevo has authenticated, or it rejects the message.
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-tickets@64theatre.art}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-64theatre}

      SMS_ENABLED: "false"
      LOG_CHANNEL: stderr
    expose:
      - "8080"
    volumes:
      # The SQLite database and uploaded posters. Everything else in storage/
      # (caches, compiled views, logs) is rebuilt on boot and stays ephemeral.
      - 64theatre-storage:/var/www/html/storage/app
    networks:
      - edge
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  64theatre-storage:

networks:
  # Owned by the `edge` project in /srv/edge — we only join it.
  edge:
    external: true
