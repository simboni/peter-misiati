<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TallyPay</title>
  <style>
    html,body{height:100%;margin:0;background:#059669;color:#fff;
      font-family:-apple-system,system-ui,Roboto,sans-serif;display:grid;place-items:center}
    .b{text-align:center}
    .s{width:44px;height:44px;margin:18px auto 0;border:4px solid rgba(255,255,255,.3);
      border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <!-- Fallback shown only if the live app can't be reached; normally Capacitor
       loads https://tallypay.co.ke immediately. -->
  <div class="b">
    <strong style="font-size:20px">TallyPay</strong>
    <div class="s"></div>
  </div>
</body>
</html>
