plugins {
    id 'com.android.application'
}

// Release signing is driven entirely by environment variables so no secret ever
// lives in the repo. In CI these come from GitHub Actions secrets; when they are
// absent (e.g. a debug build) the release signingConfig is simply left unset and
// only the debug APK (auto-signed by the SDK) is produced.
def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseSigning = ksPath != null && !ksPath.isEmpty()

android {
    namespace 'ke.co.tallypay.app'
    compileSdk 34

    defaultConfig {
        applicationId "ke.co.tallypay.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity support — launches tallypay.co.ke full-screen and
    // verifies the Digital Asset Links to drop the browser URL bar.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
