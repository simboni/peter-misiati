<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMP CRM — clients & campaigns</title>
<style>
  :root{
    --bg:#f6f8f6; --card:#ffffff; --band:#eff2ef; --line:#d8deda; --line2:#bcc6bf;
    --ink:#111814; --body:#516057; --faint:#6c7a71; --mut:#97a29a;
    --acc:#0a9d61; --acc-d:#07603c; --warn:#b45309; --danger:#b91c1c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--body);padding-bottom:70px}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink)}
  .mark{width:34px;height:34px;border-radius:9px;background:#0e1512;color:#2ee88a;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:15px}
  .brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:9}
  nav button{flex:1;padding:11px 4px;border:0;background:none;color:var(--faint);font-size:12px;font-weight:600;cursor:pointer}
  nav button.on{color:var(--acc)}
  nav button .ic{display:block;font-size:18px;margin-bottom:2px}
  h2{color:var(--ink);font-size:19px;margin:18px 0 4px}
  .sub{font-size:13px;color:var(--faint);margin-bottom:14px}
  .grid{display:grid;gap:12px}
  @media(min-width:700px){.grid.cols{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat .n{font-size:26px;font-weight:800;color:var(--ink)}
  .stat .l{font-size:12px;color:var(--faint)}
  .stat.warn .n{color:var(--warn)}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--faint);background:var(--band)}
  .pill.acc{background:#e5f5ee;border-color:#b9e4d0;color:var(--acc-d)}
  .pill.warn{background:#fef3e2;border-color:#f5d9ae;color:var(--warn)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer}
  .btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
  .btn.ghost{border:0;background:none;color:var(--acc-d)}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;font:inherit;color:var(--ink);background:var(--card)}
  textarea{min-height:80px;resize:vertical}
  label{display:block;font-size:12px;font-weight:600;color:var(--faint);margin:10px 0 4px}
  .lead{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;margin-bottom:10px}
  .lead .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .lead h3{font-size:15px;color:var(--ink)}
  .lead .meta{font-size:12px;color:var(--faint);margin-top:2px}
  .lead .due{font-size:12px;margin-top:6px}
  .due.over{color:var(--danger);font-weight:700}
  .due.today{color:var(--warn);font-weight:700}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .stagebar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
  .stagebar .s{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;color:var(--faint);cursor:pointer}
  .stagebar .s.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tmpl{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;margin-bottom:12px}
  .tmpl h3{font-size:14px;color:var(--ink);margin-bottom:6px}
  .tmpl pre{white-space:pre-wrap;font:13px/1.55 inherit;color:var(--body);background:var(--band);border-radius:8px;padding:10px;max-height:170px;overflow:auto}
  .post{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;margin-bottom:12px}
  .post h3{font-size:14px;color:var(--ink)}
  .post .body{font-size:13px;color:var(--body);background:var(--band);border-radius:8px;padding:10px;margin:8px 0;white-space:pre-wrap;max-height:150px;overflow:auto}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  dialog{border:0;border-radius:14px;padding:0;max-width:520px;width:calc(100vw - 32px);box-shadow:0 30px 80px -30px rgba(0,0,0,.4)}
  dialog::backdrop{background:rgba(10,20,14,.45)}
  .dlg{padding:18px}
  .dlg h3{color:var(--ink);margin-bottom:6px}
  .hint{font-size:12px;color:var(--mut)}
  .log{font-size:12px;color:var(--faint);border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
  a{color:var(--acc-d)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">&lt;/&gt;</span><span>SMP CRM<small>clients · campaigns · follow-ups</small></span></div>
  <button class="btn sm" onclick="ui.exportCsv()">Export CSV</button>
</header>

<div class="wrap" id="view"></div>
<div class="toast" id="toast"></div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<nav>
  <button data-tab="dash"><span class="ic">📊</span>Dashboard</button>
  <button data-tab="pipe"><span class="ic">👥</span>Pipeline</button>
  <button data-tab="posts"><span class="ic">📣</span>Campaigns</button>
  <button data-tab="tmpl"><span class="ic">✉️</span>Scripts</button>
  <button data-tab="data"><span class="ic">⚙️</span>Data</button>
</nav>

<script>
/* ============================ store ============================ */
const KEY='smp-crm-v1';
const STAGES=['New','Contacted','Replied','Call booked','Proposal sent','Signed','Lost'];
const NICHES=['NGO','SME','SACCO/Fintech','Political','School/E-learning','Other'];

const SEED_POSTS=[
 {t:'Reintroduction — what I build',img:'smp-capabilities-square.png',week:'W1 Mon',body:`After 10+ years and 100+ projects, I've rebuilt my portfolio from scratch.\n\nI'm Peter Misiati — I build the software organisations run on:\n🏗️ In-house systems (ERP, microfinance, SACCO)\n🌍 Websites for NGOs, businesses & public figures\n💳 Fintech with M-Pesa integration\n📚 E-learning platforms\n\nEvery project is a full case study — the problem, the approach, the result:\n👉 smp-developers.com\n\nBuilding something? My DMs are open.`},
 {t:'NGO case study — COSDEP',img:'mockups/cosdep-kenya.webp',week:'W1 Thu',body:`An NGO's website isn't a brochure. It's a funding document.\n\nWhen COSDEP Kenya (sustainable agriculture, smallholder farmers) needed a web presence, the goal wasn't "look nice" — it was: help donors and partners *see* the work they'd be funding.\n\nSo the site leads with programmes and impact, loads in under a second on mobile, and puts donate/partner paths front and centre.\n\nFull case study: smp-developers.com/work/cosdep-kenya\nIf your organisation's story isn't reaching funders, let's talk.`},
 {t:'Fintech — TallyPay',img:'mockups/tallypay.webp',week:'W2 Mon',body:`Kenyan freelancers juggle quotes, invoices, VAT and M-Pesa receipts across WhatsApp and spreadsheets.\n\nI built TallyPay to fix that: quote → invoice → M-Pesa payment → receipt, one flow.\nMulti-tenant SaaS, PDF generation, admin console — designed and shipped end to end.\n\nCase study: smp-developers.com/work/tallypay\nNeed billing, payments or an internal system that just works? Talk to me.`},
 {t:'How I work — trust post',img:'',week:'W2 Thu',body:`How I work, in 4 lines:\n\n1. Tailored, not templated — built around your actual needs.\n2. End to end — discovery, design, build, launch, handover. One person accountable.\n3. Impact-driven — systems that work, businesses that grow.\n4. You can update it yourself — I build so you're not dependent on me for every comma.\n\nThat's why clients come back. smp-developers.com`},
 {t:'Political brand — Dr. Wamalwa',img:'mockups/dennis-wamalwa.webp',week:'W3 Mon',body:`Public figures: if you don't own your story online, someone else tells it for you.\n\nI built the official platform for a KNCHR commissioner — two decades of human-rights work, press, gallery and supporter mobilisation in one credible home.\n\nsmp-developers.com/work/dennis-wamalwa\nAhead of the next season, what does your official platform say about you?`},
 {t:'Craft post — 3 themes',img:'',week:'W3 Thu',body:`Small detail from this week: my portfolio now ships with 3 themes — Light, Dark, Midnight — switchable in one tap, remembered across visits.\n\nWhy bother? Because details are the difference between "it works" and "it feels right". The same care goes into every client build.\n\nsmp-developers.com (try the toggle ☀️🌙)`},
 {t:'SME — Fit Generations',img:'mockups/fit-generations.jpg',week:'W4 Mon',body:`A Bungoma gym was losing members to a slow, dated WordPress site.\n\nRebuilt: classes, coaches, pricing, live BMI calculator, member portal — loading in under a second on mobile.\n\nYour website is your hardest-working employee. Is yours doing its job?\nsmp-developers.com/work/fit-generations`},
 {t:'Direct ask — availability',img:'smp-capabilities-story.png',week:'W4 Thu',body:`Taking on new projects for next month.\n\nIf you need:\n✅ A website that wins trust (NGO, business, personal brand)\n✅ An internal system (ERP, SACCO, billing)\n✅ An M-Pesa-integrated product\n\n…reply here or WhatsApp +254 706 289 514. First consultation is free, and you'll get honest advice either way.`},
];

const SEED_TMPL=[
 {t:'Past-client reactivation',b:`Hi {{name}}, Peter from SMP Developers here — hope {{org}} is doing well!\nI've just rebuilt my portfolio and your project is featured: smp-developers.com/work\nTwo quick things:\n1) If you were happy with the work, a one-line Google review would mean a lot.\n2) I have capacity for new projects — if you know an organisation that needs a website or system, I'd genuinely appreciate an intro. I say thank you with 10% of any signed project.\nHow has the site/system been performing?`},
 {t:'NGO pitch',b:`Hello {{name}}, I came across {{org}}'s work — impressive impact.\nI'm Peter, a Nairobi-based software engineer. I recently built the online homes for COSDEP Kenya and the Canossian Sisters' East Africa mission — sites built to turn donors and partners into supporters: smp-developers.com/work/cosdep-kenya\nA strong web presence is often the difference between a proposal that gets funded and one that doesn't. Do you have 15 minutes this week for a quick call about what that could look like for {{org}}?`},
 {t:'SACCO / fintech pitch',b:`Hello {{name}}, I'm Peter Misiati — a software engineer with 10+ years building financial systems in Kenya, including microfinance systems, SACCO platforms and TallyPay (invoicing + M-Pesa billing): smp-developers.com/work/tallypay\nMany SACCOs are still running on spreadsheets or systems members can't access from their phones. I build member portals, loan tracking and M-Pesa-integrated systems — built here, supported here.\nWould a 15-minute call this week make sense to see what {{org}} members currently struggle with?`},
 {t:'SME pitch',b:`Hi {{name}}, I noticed {{org}} — great work.\nI'm Peter, I build fast, modern websites for Kenyan businesses — recent work includes Fit Generations Gym and Misiati & Associates (CPA firm): smp-developers.com/work\nA proper site typically pays for itself in bookings and credibility within months.\nFree 15-minute call this week? I'll give you 2–3 concrete ideas whether or not we work together.`},
 {t:'Political / public figure pitch',b:`Hello {{name}}, I'm Peter Misiati, a software engineer and digital brand consultant.\nI recently built the official platform for a KNCHR commissioner — his record, media presence and supporter mobilisation in one credible home: smp-developers.com/work/dennis-wamalwa\nA strong official platform is the difference between owning your story and letting others tell it. I'd be glad to show you what this could look like — 15 minutes, any day this week.`},
 {t:'Follow-up #1 (day 3)',b:`Hi {{name}}, following up on my note about {{org}}. I know inboxes are busy!\nShort version: I build websites and systems for organisations like yours — here's recent work: smp-developers.com/work. 15 minutes this week?`},
 {t:'Follow-up #2 (day 8, close the loop)',b:`Hi {{name}}, last note from me — I'll assume the timing isn't right and won't keep nudging.\nIf a website or system comes up later, my work lives at smp-developers.com and I'm on WhatsApp at +254 706 289 514. All the best with {{org}}!`},
 {t:'Review ask (after launch)',b:`Hi {{name}}, so glad the project is live! 🎉 If you have 2 minutes, a short review would help me a lot — it's how organisations like yours find me. Even one honest line about what it was like working together is perfect. Thank you!`},
];

let db=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.leads)return d;}catch(e){}
  return {leads:[],posts:SEED_POSTS.map((p,i)=>({id:'p'+i,title:p.t,body:p.body,img:p.img,week:p.week,status:'Queued',postedAt:''})),tmpl:SEED_TMPL,log:[]};
}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}
function copy(text,msg){navigator.clipboard.writeText(text).then(()=>toast(msg||'Copied ✓')).catch(()=>{prompt('Copy:',text);});}

/* ============================ ui ============================ */
let tab='dash', stageFilter='All';
const ui={
  go(t){tab=t;render();},
  addLead(){
    openDlg(`<h3>New lead</h3>
      <label>Organisation</label><input id="f_org">
      <label>Contact name</label><input id="f_name">
      <label>Phone / email</label><input id="f_c">
      <label>Niche</label><select id="f_n">${NICHES.map(n=>`<option>${n}</option>`).join('')}</select>
      <label>Source</label><select id="f_s"><option>Direct outreach</option><option>Referral</option><option>Past client</option><option>Social media</option><option>Website</option><option>Other</option></select>
      <label>Next action date</label><input id="f_d" type="date" value="${today()}">
      <label>Notes</label><textarea id="f_no"></textarea>
      <div class="row"><button class="btn acc" onclick="ui.saveLead()">Save lead</button><button class="btn" onclick="dlg.close()">Cancel</button></div>`);
  },
  saveLead(){
    const l={id:'l'+Date.now(),org:$('#f_org').value.trim(),name:$('#f_name').value.trim(),contact:$('#f_c').value.trim(),
      niche:$('#f_n').value,source:$('#f_s').value,stage:'New',next:$('#f_d').value,notes:$('#f_no').value.trim(),log:[`${today()} · added`]};
    if(!l.org){toast('Organisation is required');return;}
    db.leads.unshift(l);save();dlg.close();render();toast('Lead added ✓');
  },
  openLead(id){
    const l=db.leads.find(x=>x.id===id);if(!l)return;
    openDlg(`<h3>${esc(l.org)}</h3><div class="hint">${esc(l.name)} · ${esc(l.contact)} · ${esc(l.niche)} · via ${esc(l.source)}</div>
      <label>Stage</label><select id="e_st">${STAGES.map(s=>`<option ${s===l.stage?'selected':''}>${s}</option>`).join('')}</select>
      <label>Next action date</label><input id="e_d" type="date" value="${l.next||''}">
      <label>Add note</label><textarea id="e_no" placeholder="What happened?"></textarea>
      <div class="row">
        <button class="btn acc" onclick="ui.updLead('${l.id}')">Save</button>
        <button class="btn" onclick="ui.useTmplFor('${l.id}')">✉️ Use script</button>
        <button class="btn" style="color:var(--danger)" onclick="ui.delLead('${l.id}')">Delete</button>
      </div>
      <div class="log">${(l.log||[]).slice(-6).map(esc).join('<br>')}</div>
      ${l.notes?`<div class="log">Notes: ${esc(l.notes)}</div>`:''}`);
  },
  updLead(id){
    const l=db.leads.find(x=>x.id===id);if(!l)return;
    const st=$('#e_st').value,d=$('#e_d').value,no=$('#e_no').value.trim();
    if(st!==l.stage){l.log.push(`${today()} · ${l.stage} → ${st}`);l.stage=st;}
    if(no){l.log.push(`${today()} · ${no}`);}
    l.next=d;save();dlg.close();render();toast('Saved ✓');
  },
  delLead(id){if(!confirm('Delete this lead?'))return;db.leads=db.leads.filter(x=>x.id!==id);save();dlg.close();render();},
  useTmplFor(id){
    const l=db.leads.find(x=>x.id===id);dlg.close();
    openDlg(`<h3>Pick a script for ${esc(l.org)}</h3>`+db.tmpl.map((t,i)=>
      `<div class="row"><button class="btn" style="flex:1;justify-content:flex-start" onclick="ui.copyTmpl(${i},'${l.id}')">${esc(t.t)}</button></div>`).join('')+
      `<div class="row"><button class="btn" onclick="dlg.close()">Close</button></div>`);
  },
  copyTmpl(i,id){
    const l=id?db.leads.find(x=>x.id===id):null;
    let b=db.tmpl[i].b.replaceAll('{{name}}',l?.name||'[name]').replaceAll('{{org}}',l?.org||'[organisation]');
    copy(b,'Script copied — paste into WhatsApp/email');
    if(l){l.log.push(`${today()} · sent "${db.tmpl[i].t}"`);if(l.stage==='New'){l.stage='Contacted';}
      const d=new Date();d.setDate(d.getDate()+3);l.next=d.toISOString().slice(0,10);save();render();}
  },
  markPosted(id){
    const p=db.posts.find(x=>x.id===id);p.status='Posted';p.postedAt=today();save();render();toast('Marked posted ✓');
  },
  copyPost(id){const p=db.posts.find(x=>x.id===id);copy(p.body,'Caption copied — paste & post');},
  exportCsv(){
    const rows=[['org','name','contact','niche','source','stage','next_action','notes'],
      ...db.leads.map(l=>[l.org,l.name,l.contact,l.niche,l.source,l.stage,l.next,(l.notes||'').replace(/\n/g,' ')])];
    const csv=rows.map(r=>r.map(c=>`"${String(c??'').replaceAll('"','""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download=`smp-leads-${today()}.csv`;a.click();toast('CSV downloaded ✓');
  },
  importCsv(input){
    const f=input.files[0];if(!f)return;
    f.text().then(txt=>{
      const lines=txt.split(/\r?\n/).filter(Boolean);const head=lines.shift().toLowerCase();
      let n=0;
      for(const line of lines){
        const c=line.match(/("([^"]|"")*"|[^,]*)(,|$)/g)?.map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replaceAll('""','"'))||[];
        if(c.length<3)continue;
        const get=(k,d)=>{const idx=head.split(',').findIndex(h=>h.includes(k));return idx>=0?(c[idx]||d):d;};
        db.leads.push({id:'l'+Date.now()+n,org:get('org',c[1]||''),name:get('name',''),contact:get('phone',get('contact','')),
          niche:get('niche','Other'),source:get('source','Import'),stage:get('status',get('stage','New')),
          next:get('next','')||today(),notes:get('note',''),log:[`${today()} · imported`]});n++;
      }
      save();render();toast(`Imported ${n} leads ✓`);
    });
  },
  reset(){if(confirm('Erase ALL CRM data on this device?')){localStorage.removeItem(KEY);db=load();render();}}
};
const dlg=document.getElementById('dlg');
function openDlg(html){$('#dlgBody').innerHTML=html;dlg.showModal();}

/* ============================ views ============================ */
function dueClass(d){if(!d)return '';return d<today()?'over':(d===today()?'today':'');}
function leadCard(l){
  const dc=dueClass(l.next);
  return `<div class="lead" onclick="ui.openLead('${l.id}')">
    <div class="top"><div><h3>${esc(l.org)}</h3><div class="meta">${esc(l.name||'—')} · ${esc(l.niche)} · via ${esc(l.source)}</div></div>
    <span class="pill ${l.stage==='Signed'?'acc':''}">${esc(l.stage)}</span></div>
    ${l.next?`<div class="due ${dc}">${dc==='over'?'⚠️ overdue: ':'next: '}${esc(l.next)}</div>`:''}
  </div>`;
}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const v=$('#view');
  if(tab==='dash'){
    const overdue=db.leads.filter(l=>l.next&&l.next<today()&&!['Signed','Lost'].includes(l.stage));
    const dueToday=db.leads.filter(l=>l.next===today()&&!['Signed','Lost'].includes(l.stage));
    const by=s=>db.leads.filter(l=>l.stage===s).length;
    const queued=db.posts.filter(p=>p.status==='Queued').length;
    v.innerHTML=`<h2>Dashboard</h2><div class="sub">The four numbers that matter — and what needs you today.</div>
      <div class="grid cols">
        <div class="card stat"><div class="n">${by('Contacted')+by('Replied')}</div><div class="l">In conversation</div></div>
        <div class="card stat"><div class="n">${by('Call booked')}</div><div class="l">Calls booked</div></div>
        <div class="card stat"><div class="n">${by('Proposal sent')}</div><div class="l">Proposals out</div></div>
        <div class="card stat"><div class="n">${by('Signed')}</div><div class="l">Signed 🎉</div></div>
        <div class="card stat ${overdue.length?'warn':''}"><div class="n">${overdue.length}</div><div class="l">Overdue follow-ups</div></div>
        <div class="card stat"><div class="n">${queued}</div><div class="l">Posts in queue</div></div>
      </div>
      ${overdue.length||dueToday.length?`<h2>Do these now</h2>`:''}
      ${[...overdue,...dueToday].map(leadCard).join('')}
      <div class="row"><button class="btn acc" onclick="ui.addLead()">＋ Add lead</button>
      <button class="btn" onclick="ui.go('posts')">📣 Today's posts</button></div>`;
  }
  if(tab==='pipe'){
    const list=stageFilter==='All'?db.leads:db.leads.filter(l=>l.stage===stageFilter);
    v.innerHTML=`<h2>Pipeline</h2><div class="sub">${db.leads.length} leads · tap a card to update, log activity or fire a script.</div>
      <div class="stagebar">${['All',...STAGES].map(s=>`<span class="s ${s===stageFilter?'on':''}" onclick="stageFilter='${s}';render()">${s}${s!=='All'?` (${db.leads.filter(l=>l.stage===s).length})`:''}</span>`).join('')}</div>
      <div class="row" style="margin:0 0 12px"><button class="btn acc" onclick="ui.addLead()">＋ Add lead</button></div>
      ${list.map(leadCard).join('')||'<div class="card">No leads here yet. Add your first 5 past clients — move #1 of the plan.</div>'}`;
  }
  if(tab==='posts'){
    v.innerHTML=`<h2>Campaigns</h2><div class="sub">Month-1 queue preloaded. Copy → open the platform → paste → post → mark done. Images live in your repo's <b>public/marketing</b> & <b>public/mockups</b>.</div>
      ${db.posts.map(p=>`<div class="post">
        <div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(p.week)} — ${esc(p.title)}</h3>
        <span class="pill ${p.status==='Posted'?'acc':'warn'}">${p.status}${p.postedAt?' '+p.postedAt:''}</span></div>
        ${p.img?`<div class="hint">🖼 ${esc(p.img)}</div>`:''}
        <div class="body">${esc(p.body)}</div>
        <div class="row">
          <button class="btn sm acc" onclick="ui.copyPost('${p.id}')">Copy caption</button>
          <a class="btn sm" target="_blank" href="https://www.linkedin.com/feed/?shareActive=true">Open LinkedIn</a>
          <a class="btn sm" target="_blank" href="https://business.facebook.com/latest/composer">Open Meta Suite</a>
          <a class="btn sm" target="_blank" href="https://wa.me/">WhatsApp</a>
          ${p.status!=='Posted'?`<button class="btn sm ghost" onclick="ui.markPosted('${p.id}')">✓ Mark posted</button>`:''}
        </div></div>`).join('')}`;
  }
  if(tab==='tmpl'){
    v.innerHTML=`<h2>Outreach scripts</h2><div class="sub">Copy fills in the lead's name/org automatically when opened from a lead. From here it copies with placeholders.</div>
      ${db.tmpl.map((t,i)=>`<div class="tmpl"><h3>${esc(t.t)}</h3><pre>${esc(t.b)}</pre>
      <div class="row"><button class="btn sm acc" onclick="ui.copyTmpl(${i},null)">Copy</button></div></div>`).join('')}`;
  }
  if(tab==='data'){
    v.innerHTML=`<h2>Data</h2><div class="sub">Everything is stored <b>only in this browser</b> (localStorage) — private to this device. Export regularly as backup.</div>
      <div class="card"><h3 style="color:var(--ink);font-size:14px">Backup & sync</h3>
        <div class="row">
          <button class="btn acc" onclick="ui.exportCsv()">⬇ Export leads CSV</button>
          <label class="btn" style="cursor:pointer">⬆ Import leads CSV<input type="file" accept=".csv" style="display:none" onchange="ui.importCsv(this)"></label>
        </div>
        <p class="hint" style="margin-top:10px">Import accepts the repo's <b>docs/marketing/leads.csv</b> format. Use export before switching devices.</p></div>
      <div class="card" style="margin-top:12px"><h3 style="color:var(--danger);font-size:14px">Danger zone</h3>
        <div class="row"><button class="btn" style="color:var(--danger)" onclick="ui.reset()">Erase all data on this device</button></div></div>`;
  }
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>ui.go(b.dataset.tab));
render();
</script>
</body>
</html>
