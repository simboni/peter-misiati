name: Build Android app

# Builds the TallyPay Android app (a Trusted Web Activity wrapping tallypay.co.ke)
# and uploads the installable files as downloadable artifacts.
#
# - A DEBUG apk is ALWAYS built and uploaded — no setup needed. Download it from
#   the run's "Artifacts" section, transfer to your phone and install (enable
#   "Install unknown apps" for your file manager). Use this to try the app now.
#
# - A signed RELEASE .aab (for Google Play) + .apk are built only once you add
#   the signing secrets below. Generate an upload keystore once, then add four
#   repository secrets (Settings → Secrets and variables → Actions):
#       ANDROID_KEYSTORE_BASE64   base64 of your .keystore file
#       ANDROID_KEYSTORE_PASSWORD store password
#       ANDROID_KEY_ALIAS         key alias
#       ANDROID_KEY_PASSWORD      key password
#   Generate the keystore (keep the file + passwords safe — the SAME key must
#   sign every future update):
#       keytool -genkeypair -v -keystore tallypay-upload.keystore \
#         -alias tallypay -keyalg RSA -keysize 2048 -validity 10000
#       base64 -w0 tallypay-upload.keystore   # paste into ANDROID_KEYSTORE_BASE64
#
# Run it: Actions tab → "Build Android app" → Run workflow. See docs/play-store.md.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/multivendor-billing-platform-ph3rwt
    paths:
      - "android/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # "true" only when all four signing secrets are present.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tallypay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Signing not configured (skipping release)
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::Release build skipped — add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repo secrets to build a Play-ready signed .aab."

      - name: Decode keystore
        if: env.HAS_SIGNING == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/tallypay.keystore"

      - name: Build signed release bundle (.aab) and APK
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tallypay.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release bundle + APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tallypay-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
