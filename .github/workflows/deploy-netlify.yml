# Builds on GitHub's free runners and hands Netlify the finished files
# (--no-build), so deploys consume no Netlify build minutes.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  — Netlify: User settings → Applications → New access token
#   NETLIFY_SITE_ID     — Netlify: Site configuration → Site details → Site ID
# Until both secrets exist, the deploy step skips cleanly instead of failing.
name: Deploy to Netlify

on:
  push:
    branches: [main, claude/keysa-ngo-website-rj3rg1]
  workflow_dispatch: {}

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Check Netlify credentials
        id: creds
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set — build verified, deploy skipped."
          fi

      - name: Deploy prebuilt files to Netlify
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes netlify-cli deploy --prod --dir=out --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
