name: Deploy billing app

# Builds the billing/ app (OpenNext) and deploys it to Cloudflare Workers,
# running the D1 migrations first. Fires on pushes that touch billing/ on the
# branches below, and can be run manually from the Actions tab.
#
# One-time setup (see billing/README.md):
#   1. `cd billing && npx wrangler d1 create billing-db` and paste the printed
#      database_id into billing/wrangler.jsonc.
#   2. Add two repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#   3. Set the app's Worker secrets once (BETTER_AUTH_SECRET, BETTER_AUTH_URL,
#      optional RESEND_* / KOPOKOPO_*) via `wrangler secret put`.
# After that, every push here deploys automatically.

on:
  push:
    branches:
      - claude/new-project-setup-cniwcp
      - claude/multivendor-billing-platform-ph3rwt
    paths:
      - "billing/**"
      - ".github/workflows/deploy-billing.yml"
  workflow_dispatch:

concurrency:
  group: deploy-billing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billing
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: billing/package-lock.json

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings → Secrets → Actions) to enable deploys."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply billing-db --remote

      - name: Build & deploy (OpenNext → Cloudflare Workers)
        run: |
          npm run cf:build
          npm run cf:deploy
