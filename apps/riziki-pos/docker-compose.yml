# Riziki POS — the whole deployment.
#
#   docker compose up -d          start (or restart after an update)
#   docker compose logs -f pos    watch the app
#
# HTTPS IS NOT THIS PROJECT'S JOB, and that is the point of this file.
#
# This stack used to run its own Caddy and bind the host's ports 80 and 443.
# That was written as if this server held nothing else. It holds fifteen other
# things — 64theatre, Fit Generations, St Stephen's, Civora, DawaPoint and the
# rest — and every one of them joins a shared proxy, `edge-caddy`, which owns
# those two ports and routes by hostname from `/srv/edge/sites/*.caddy`.
#
# A port can be bound by exactly one process. So two proxies on one box is a
# race nobody wins twice: whichever starts first serves everything, the other
# fails silently, and if this one ever won the race it would take every other
# site on the server down with it — its Caddyfile knew three hostnames.
#
# So: no ports, no proxy here. Both containers expose an internal port and join
# the `edge` network, exactly as the others do, and the hostnames live in a
# site file at deploy/edge/rizikichemicals.caddy — see DEPLOY.md for installing
# it. The only thing this project owns is its own two containers.

services:
  pos:
    build: .
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      # Everything the shop owns is in this directory. Losing it is losing the
      # business records — see DEPLOY.md for the backup cron.
      - ./data:/app/data
    networks:
      - edge

  # The public website. Built from source in its own image, so `up -d --build`
  # updates the site and the shop system together — see apps/riziki-web/Dockerfile
  # for why this is not a mounted directory any more.
  web:
    build: ../riziki-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge

networks:
  # Owned by the `edge` project in /srv/edge — we only join it. Declared the
  # same way every other app on this box declares it.
  edge:
    external: true
