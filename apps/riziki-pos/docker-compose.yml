# Riziki POS — the whole deployment.
#
#   docker compose up -d          start (or restart after an update)
#   docker compose logs -f pos    watch the app
#
# `caddy` terminates HTTPS on the shop's domain. HTTPS is not cosmetic here:
# the offline mode (service worker) and "install to home screen" only work on
# a secure origin, and offline is the feature the counter phone depends on.
# Put the real domain in deploy/Caddyfile before starting.

services:
  pos:
    build: .
    # PINNED, because the shared proxy addresses this container BY NAME.
    #
    # Compose otherwise names containers after the directory it is run from,
    # so renaming or moving this checkout silently renames the container and
    # the edge's route stops resolving. Worse, the name it derives — `pos` as
    # a network alias — is a name other projects on this box could also use,
    # and Docker's DNS answers an ambiguous alias with ALL of the matching
    # containers, in rotation. That is not theory: the website was addressed
    # as `web`, several projects here have a service called `web`, and the
    # shop's own domain served a different company's site on every refresh.
    container_name: riziki-pos-pos-1
    restart: unless-stopped
    # Docker's default log driver writes JSON to disk and NEVER rotates it.
    # A year of a chatty container is tens of gigabytes, and the first symptom
    # is a disk with no room for the shop's database to write a transaction.
    # Thirty megabytes is several days of this app's output, which is longer
    # than anybody looks back.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3100"
    volumes:
      # Everything the shop owns is in this directory. Losing it is losing the
      # business records — see DEPLOY.md for the backup cron.
      - ./data:/app/data

  # The public website. Built from source in its own image, so `up -d --build`
  # updates the site and the shop system together — see apps/riziki-web/Dockerfile
  # for why this is not a mounted directory any more.
  web:
    build:
      context: ../riziki-web
      args:
        # Empty unless set in .env, which produces a site with no tracking
        # rather than one with a broken script tag. See deploy/analytics.env.example.
        NEXT_PUBLIC_ANALYTICS_SRC: ${NEXT_PUBLIC_ANALYTICS_SRC:-}
        NEXT_PUBLIC_ANALYTICS_ID: ${NEXT_PUBLIC_ANALYTICS_ID:-}
    # Pinned for the same reason, and this is the one it actually happened to.
    container_name: riziki-pos-web-1
    restart: unless-stopped
    # Docker's default log driver writes JSON to disk and NEVER rotates it.
    # A year of a chatty container is tens of gigabytes, and the first symptom
    # is a disk with no room for the shop's database to write a transaction.
    # Thirty megabytes is several days of this app's output, which is longer
    # than anybody looks back.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "80"

  # A proxy of our own — OFF unless explicitly asked for, and that matters.
  #
  # This server carries sixteen sites behind one shared `edge-caddy`, which
  # owns ports 80 and 443 and already serves this project's three hostnames by
  # importing deploy/Caddyfile straight out of the repo. A port is held by
  # exactly one process, so a second proxy here is a race: it loses today
  # (the edge starts first and this one fails quietly), but on a reboot it
  # could win — and it knows three hostnames, so the other fifteen sites would
  # go dark at once. Nobody would see an error; they would just stop loading.
  #
  # So it only starts when asked:
  #
  #   docker compose --profile standalone up -d
  #
  # which is right on a server running nothing else, and wrong on this one.
  # See SANDBOX.md. `docker compose up -d` leaves it alone.
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pos
      - web

  # ------------------------------------------------------------------ #
  # Visitor measurement. OFF unless asked for, like the proxy above.
  #
  #   docker compose --profile analytics up -d
  #
  # Nothing about the shop system or the website depends on these. They are
  # behind a profile so that a plain `docker compose up -d` — which is what
  # deploy/update.sh runs, on a box carrying fifteen other clients' sites —
  # behaves exactly as it did before this was added. A half-configured
  # analytics stack must never be able to hold up a till deploy.
  # ------------------------------------------------------------------ #
  analytics:
    image: ${ANALYTICS_IMAGE:-ghcr.io/umami-software/umami:postgresql-latest}
    container_name: riziki-analytics
    profiles: ["analytics"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3000"
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:${ANALYTICS_DB_PASSWORD:-}@riziki-analytics-db:5432/umami
      APP_SECRET: ${ANALYTICS_APP_SECRET:-}
      # Renamed from the default so a blunt ad-blocker rule does not silently
      # delete half the shop's traffic figures.
      TRACKER_SCRIPT_NAME: s
    depends_on:
      analytics-db:
        condition: service_healthy

  analytics-db:
    image: postgres:16-alpine
    container_name: riziki-analytics-db
    profiles: ["analytics"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-}
    volumes:
      - analytics-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  caddy-data:
  caddy-config:
  analytics-db:
