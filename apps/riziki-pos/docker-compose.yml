# Riziki POS — the whole deployment.
#
#   docker compose up -d          start (or restart after an update)
#   docker compose logs -f pos    watch the app
#
# `caddy` terminates HTTPS on the shop's domain. HTTPS is not cosmetic here:
# the offline mode (service worker) and "install to home screen" only work on
# a secure origin, and offline is the feature the counter phone depends on.
# Put the real domain in deploy/Caddyfile before starting.

services:
  pos:
    build: .
    # PINNED, because the shared proxy addresses this container BY NAME.
    #
    # Compose otherwise names containers after the directory it is run from,
    # so renaming or moving this checkout silently renames the container and
    # the edge's route stops resolving. Worse, the name it derives — `pos` as
    # a network alias — is a name other projects on this box could also use,
    # and Docker's DNS answers an ambiguous alias with ALL of the matching
    # containers, in rotation. That is not theory: the website was addressed
    # as `web`, several projects here have a service called `web`, and the
    # shop's own domain served a different company's site on every refresh.
    container_name: riziki-pos-pos-1
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      # Everything the shop owns is in this directory. Losing it is losing the
      # business records — see DEPLOY.md for the backup cron.
      - ./data:/app/data

  # The public website. Built from source in its own image, so `up -d --build`
  # updates the site and the shop system together — see apps/riziki-web/Dockerfile
  # for why this is not a mounted directory any more.
  web:
    build: ../riziki-web
    # Pinned for the same reason, and this is the one it actually happened to.
    container_name: riziki-pos-web-1
    restart: unless-stopped
    expose:
      - "80"

  # A proxy of our own — OFF unless explicitly asked for, and that matters.
  #
  # This server carries sixteen sites behind one shared `edge-caddy`, which
  # owns ports 80 and 443 and already serves this project's three hostnames by
  # importing deploy/Caddyfile straight out of the repo. A port is held by
  # exactly one process, so a second proxy here is a race: it loses today
  # (the edge starts first and this one fails quietly), but on a reboot it
  # could win — and it knows three hostnames, so the other fifteen sites would
  # go dark at once. Nobody would see an error; they would just stop loading.
  #
  # So it only starts when asked:
  #
  #   docker compose --profile standalone up -d
  #
  # which is right on a server running nothing else, and wrong on this one.
  # See SANDBOX.md. `docker compose up -d` leaves it alone.
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pos
      - web

volumes:
  caddy-data:
  caddy-config:
